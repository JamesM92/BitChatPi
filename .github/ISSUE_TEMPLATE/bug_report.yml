name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** check `journalctl -u bitchatd -f` and `tail -f /tmp/bitchatd.log` for error output.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Daemon (BLE / mesh)
        - Daemon (IPC API)
        - TUI client
        - Installation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start daemon with `sudo ./start-server.sh`
        2. Connect phone
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: text
      description: Paste relevant lines from `journalctl -u bitchatd` or `/tmp/bitchatd.log`.

  - type: input
    id: pi-model
    attributes:
      label: Pi model
      placeholder: "e.g. Raspberry Pi 4B"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Python version
      placeholder: "e.g. Raspberry Pi OS Bookworm 64-bit, Python 3.11.2"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BitChatPi version
      placeholder: "e.g. v1.0.0 or commit SHA"
    validations:
      required: true
