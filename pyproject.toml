[project]
name = "bitchatpi"
version = "1.0.0"
description = "Raspberry Pi BLE mesh node for the BitChat protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "bleak==3.0.1",
    "dbus-fast==4.0.4",
    "dissononce==0.34.3",
    "cryptography==47.0.0",
]

[project.urls]
Repository = "https://github.com/JamesM92/BitChatPi"

[project.optional-dependencies]
client = [
    "urwid==4.0.0",
    "pillow==12.2.0",
    "numpy",
    "scipy",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
